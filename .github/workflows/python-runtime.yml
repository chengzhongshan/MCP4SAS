name: Python runtime
on:
  push:
    branches: [main, feature/python-port]
    paths: ['MCP4SAS_Use_Python/**/*.py', 'MCP4SAS_Use_Python/requirements.txt', 'MCP4SAS_Use_Python/assets/**', 'MCP4SAS_Use_Python/tests/fixtures/**', '*.py', 'MCPDeps/*.py', 'tests/*.py', 'tools/*.py', 'examples/poc/**', 'README.md', 'examples/README.md', 'docs/poc/README.md', 'docs/PYTHON_DEMOS.md', 'integrations/vscode/README.md', 'install/sascfg_personal.template.py', '.github/workflows/python-runtime.yml']
  pull_request:
    paths: ['MCP4SAS_Use_Python/**/*.py', 'MCP4SAS_Use_Python/requirements.txt', 'MCP4SAS_Use_Python/assets/**', 'MCP4SAS_Use_Python/tests/fixtures/**', '*.py', 'MCPDeps/*.py', 'tests/*.py', 'tools/*.py', 'examples/poc/**', 'README.md', 'examples/README.md', 'docs/poc/README.md', 'docs/PYTHON_DEMOS.md', 'integrations/vscode/README.md', 'install/sascfg_personal.template.py', '.github/workflows/python-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: MCP4SAS_Use_Python/requirements.txt
      - name: Install the Python runtime dependencies
        run: python -m pip install -r MCP4SAS_Use_Python/requirements.txt
      - name: Verify SDK and SASPy imports
        run: python -c "import mcp, saspy; print('Python MCP SDK and SASPy imports passed')"
      - name: Run offline regression, original-Perl reference and actual MCP transport tests
        run: python -m unittest discover -s MCP4SAS_Use_Python/tests -v
      - name: Report prerequisites without SAS login
        run: python MCP4SAS_Use_Python/install.py --check
      - name: Check the CLI aliases and scientific example plans
        run: |
          python run_sas_codes_or_files_in_ODA.py --code "proc print data=sashelp.class;run;" --dry-run
          python run_sas_codes_or_script_in_ODA.py --code "proc print data=sashelp.class;run;" --dry-run
          python examples/poc/run_example.py --case clustergram --dry-run
          python examples/poc/run_example.py --case multi_gwas_gtf --dry-run
      - name: Check the newly ported homepage demo entry points
        run: |
          python MCPDeps/test_sas_log_and_labels.py
          python MCPDeps/test_sas_oda_debug_macro_guard.py
          python MCPDeps/test_sas_oda_connection_lifecycle.py
          python MCPDeps/test_sas_oda_include_lookup.py
          python MCPDeps/test_sas_oda_macro_helper_reuse.py
          python tests/new_validation_tasks_001_100.py
          python tests/covid19_gwas_validation_tasks_001_500.py
          python tests/run_live_new_examples_30.py --generate-only --batch 8 --out MCP4SAS_Use_Python/test-results/ci-batch8
          python tests/new_examples_31_60.py --out MCP4SAS_Use_Python/test-results/ci-batch2
      - name: Record installed dependency versions
        run: python -m pip freeze
