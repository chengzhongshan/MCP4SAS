name: PoC showcase

on:
  push:
    branches: [main]
    paths: ['examples/poc/**', 'docs/poc/**', 'tests/test_poc_showcase.pl', 'tests/test_poc_documents.py', 'tests/test_homepage_figure_preview.py', '.github/workflows/poc-showcase.yml', 'README.md', '.gitattributes']
  pull_request:
    paths: ['examples/poc/**', 'docs/poc/**', 'tests/test_poc_showcase.pl', 'tests/test_poc_documents.py', 'tests/test_homepage_figure_preview.py', '.github/workflows/poc-showcase.yml', 'README.md', '.gitattributes']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - name: Verify immutable sources, local links, CLI plans and invalid outputs
        run: perl tests/test_poc_showcase.pl
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check equal-height homepage previews and original source hashes
        run: python -m unittest discover -s tests -p test_homepage_figure_preview.py -v
      - name: Verify author Word originals and reader transcriptions
        run: python -m unittest discover -s tests -p test_poc_documents.py -v
