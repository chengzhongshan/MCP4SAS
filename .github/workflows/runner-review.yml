name: Runner regression checks
on:
  push:
    branches: [main, fix/copilot-runner-review, fix/saspy-python-discovery]
    paths: ['tests/test_saspy_python_discovery.pl', 'server.pl', 'tests/test_mcp_job_reporting.pl', 'tests/test_macro_span_scaling.pl', 'run_sas_codes_or*.pl', 'MCPDeps/*.pm', 'MCPDeps/test_sas_oda_macro_dir_fallback.pl', 'tests/test_copilot_runner_review.pl', 'tests/test_expected_failure_evaluation.pl', 'tests/test_sas_log_diagnostics.pl', 'tests/test_nested_include_graph.pl', 'tests/test_beta_macros.pl', 'examples/sas_macros/scASE_betabino.sas', '.github/workflows/runner-review.yml']
  pull_request:
    paths: ['tests/test_saspy_python_discovery.pl', 'server.pl', 'tests/test_mcp_job_reporting.pl', 'tests/test_macro_span_scaling.pl', 'run_sas_codes_or*.pl', 'MCPDeps/*.pm', 'MCPDeps/test_sas_oda_macro_dir_fallback.pl', 'tests/test_copilot_runner_review.pl', 'tests/test_expected_failure_evaluation.pl', 'tests/test_sas_log_diagnostics.pl', 'tests/test_nested_include_graph.pl', 'tests/test_beta_macros.pl', 'examples/sas_macros/scASE_betabino.sas', '.github/workflows/runner-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  perl:
    name: Perl regressions / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Check both compatibility entry points and offline behavior
        shell: bash
        run: |
          set -euo pipefail
          perl -c run_sas_codes_or_files_in_ODA.pl
          perl -c run_sas_codes_or_script_in_ODA.pl
          perl MCPDeps/test_sas_oda_macro_dir_fallback.pl
          perl MCPDeps/test_sas_log_and_labels.pl
          perl tests/test_sas_log_diagnostics.pl
          perl tests/test_expected_failure_evaluation.pl
          perl tests/test_copilot_runner_review.pl
          perl tests/test_runner_preflight_parity.pl
          perl tests/test_nested_include_graph.pl
          perl tests/test_beta_macros.pl
          perl tests/test_mcp_job_reporting.pl
          perl tests/test_macro_span_scaling.pl
          perl tests/test_saspy_python_discovery.pl
